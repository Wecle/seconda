name: seconda-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seconda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-seconda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-seconda}\" -d \"$${POSTGRES_DB:-seconda}\""]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${TASK_IMAGE:-seconda-task:latest}
    env_file:
      - .env.production
    command: ["pnpm", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    image: ${WEB_IMAGE:-seconda-web:latest}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
